# = Marks inactive issues and pull requests as stale, and closes them later. Never touches labelled "keep-open" items.
name: Mark stale issues and pull requests

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: keep-open,security
          exempt-pr-labels: keep-open,security
          stale-issue-message: >
            This issue has had no activity for 60 days. It will be closed in 14 days unless there is new activity or it
            is labelled "keep-open".
          stale-pr-message: >
            This pull request has had no activity for 60 days. It will be closed in 14 days unless there is new activity
            or it is labelled "keep-open".
